name = "ClosureAuditExample"
defaultTargets = ["ClosureAuditExample"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# A tiny target library for the closure audit: four honest theorems (Example.lean) and two
# negative-control modules: Tainted.lean carries an axiom, a `sorry` and a `native_decide`;
# Redeclare.lean re-declares a target's name with a `native_decide` proof and is therefore a
# separate root (the umbrella module cannot import both it and Example).  The audit scripts
# (Audit*.lean) are generated by ../generate.py and run with `lake env lean`, not built as
# part of this library.
[[lean_lib]]
name = "ClosureAuditExample"
roots = ["ClosureAuditExample", "ClosureAuditExample.Redeclare"]
