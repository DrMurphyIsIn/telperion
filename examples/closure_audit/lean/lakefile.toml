name = "ClosureAuditExample"
defaultTargets = ["ClosureAuditExample"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.32.0"

# A tiny target library for the closure audit: four honest theorems (Example.lean) and a
# negative-control module (Tainted.lean) carrying an axiom, a `sorry` and a `native_decide`.
# The audit scripts (Audit.lean, AuditTainted.lean) are generated by ../generate.py and run
# with `lake env lean`, not built as part of this library.
[[lean_lib]]
name = "ClosureAuditExample"
