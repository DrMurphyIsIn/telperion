# Kernel policy exceptions (spec 5.1; see docs/COMPARATOR.md, "Kernel policy").
#
# An entry here is a named debt: it lets one project's pin stay below the floor
# (leanprover/lean4:v4.34.1), not a claim that a second kernel already covers it. The
# v4.33.1 kernel soundness fixes (#14806, #14807, #14808, #14582, #14849) have not been
# re-checked for these projects by a second kernel such as nanoda. The list is meant to
# shrink as toolchains get upgraded past the floor; it should never grow for a project
# that could just as well be pinned at or above it. Shrink-only is enforced by review
# today — an automated check against the base branch is pending.

