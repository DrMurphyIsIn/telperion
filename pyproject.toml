[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telperion"
version = "0.1.5"
description = "Certify families of rational-function inequalities in sympy, validate them in exact arithmetic, and batch-emit kernel-checked Lean 4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Peter W. Murphy" }]
keywords = ["lean4", "mathlib", "polya", "positivity", "certificates", "sympy", "formal-verification"]
# Core engine (telperion.*) is sympy-only: `import telperion` and the whole
# certify->emit pipeline need nothing else.  The Brualdi-Goldwasser research lab
# (telperion.bg.*) is a strict opt-in — it is never imported by the engine
# (enforced by tests/test_core_boundary.py) and its graph modules need
# networkx + numpy.  Install the `bg` extra to use the lab (`graph` is a legacy
# alias).  (sos_sdp additionally needs cvxpy via the `sdp` extra.)
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
flint = ["python-flint>=0.6"]
mcp = ["mcp>=1.2"]
bg = ["networkx>=3", "numpy>=1.24"]
graph = ["networkx>=3", "numpy>=1.24"]
sdp = ["cvxpy>=1.4"]
dev = ["pytest>=8", "networkx>=3", "numpy>=1.24"]

[project.scripts]
telperion = "telperion.cli:main"
telperion-mcp = "telperion.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telperion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
