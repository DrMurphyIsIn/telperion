[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telperion"
version = "0.2.0.dev0"
description = "Certify families of rational-function inequalities in sympy, validate them in exact arithmetic, and batch-emit kernel-checked Lean 4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BUSL-1.1" }
authors = [{ name = "Peter W. Murphy" }]
keywords = ["lean4", "mathlib", "polya", "positivity", "certificates", "sympy", "formal-verification"]
# Core engine (telperion.*) is sympy-only: `import telperion` and the whole
# certify->emit pipeline need nothing else.  The research labs (telperion.bg,
# rh_jensen, ...) are not in this repository: they stay in Arda, and no engine
# module may import one (enforced by tests/test_engine_boundary.py).  The engine's
# graph modules (spectral, girardeau, ...) need networkx + numpy: the `graph` extra.
# The `bg` and `rh_jensen` extras serve the labs' installs in Arda.
# (sos_sdp additionally needs cvxpy via the `sdp` extra.)
# tomli: the missions registry parses TOML. CI runs 3.11+ and gets stdlib `tomllib`;
# without this an older interpreter silently fell back to a non-TOML subset parser, so
# the same node file could mean different things locally and in CI (audit 2026-09-19).
dependencies = ["sympy>=1.12", "tomli>=2.0; python_version < '3.11'"]

[project.optional-dependencies]
flint = ["python-flint>=0.6"]
# rh_jensen (the lab, in Arda): rigorous xi-coefficient enclosures use python-flint
# (Arb ball arithmetic) for the certified rational box; mpmath is the high-precision
# oracle its tests use.
rh_jensen = ["python-flint>=0.6", "mpmath>=1.3"]
mcp = ["mcp>=1.2,<2"]  # mcp 2.x removed mcp.server.fastmcp, which mcp_server imports
bg = ["networkx>=3", "numpy>=1.24"]
graph = ["networkx>=3", "numpy>=1.24"]
sdp = ["cvxpy>=1.4"]
dev = ["pytest>=8", "networkx>=3", "numpy>=1.24"]

[project.scripts]
telperion = "telperion.cli:main"
telperion-mcp = "telperion.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telperion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
