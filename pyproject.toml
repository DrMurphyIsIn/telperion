[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telperion"
version = "0.1.4"
description = "Certify families of rational-function inequalities in sympy, validate them in exact arithmetic, and batch-emit kernel-checked Lean 4."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Peter W. Murphy" }]
keywords = ["lean4", "mathlib", "polya", "positivity", "certificates", "sympy", "formal-verification"]
# Core pipeline is sympy-only. The BG graph-certificate modules import networkx
# and numpy lazily (in-function), so `import telperion` and the emit pipeline
# never need them; install the `graph` extra to exercise those modules and their
# tests. (sos_sdp additionally needs cvxpy; its test importorskips it.)
dependencies = ["sympy>=1.12"]

[project.optional-dependencies]
flint = ["python-flint>=0.6"]
mcp = ["mcp>=1.2"]
graph = ["networkx>=3", "numpy>=1.24"]
sdp = ["cvxpy>=1.4"]
dev = ["pytest>=8", "networkx>=3", "numpy>=1.24"]

[project.scripts]
telperion = "telperion.cli:main"
telperion-mcp = "telperion.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/telperion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
