name: telperion-ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Arda's telperion-test.yml needed 40 minutes for the full suite with python-flint installed.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
        # The same sympy matrix as Arda's telperion-test.yml: the declared floor (pyproject: sympy>=1.12) and the latest.
        sympy: ["sympy==1.12", "sympy"]
        exclude:
          # sympy 1.12 predates Python 3.14; the floor is exercised on the floor interpreter.
          - python: "3.14"
            sympy: "sympy==1.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Mirrors Arda's telperion-test.yml install line, plus `-e .` and mpmath. scs is pinned <3.3 because the
      # scs 3.3.0 Linux wheel links Intel MKL without bundling it, which aborts the interpreter mid-suite.
      - run: pip install -e . "${{ matrix.sympy }}" pytest networkx numpy cvxpy "scs<3.3" pyyaml "python-flint==0.9.0" mpmath
      - name: Unit tests
        # TELPERION_REQUIRE_FLINT: python-flint is installed above, so tests/test_flint_required.py turns a missing
        # flint or an unfound libflint into a failure instead of letting the rigorous winding tests skip. -rs lists
        # every skip reason in the log; faulthandler dumps a C stack on any native crash.
        env:
          PYTHONFAULTHANDLER: "1"
          TELPERION_REQUIRE_FLINT: "1"
        run: python -X faulthandler -m pytest tests -q -rs
  kernel-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pyyaml
      # Shrink-only enforcement needs a base to compare against, which only a pull
      # request has (the PR's base branch); a push (e.g. a merge to main) has nothing
      # to diff against, so it just re-checks the floor + exception consistency.
      - if: github.event_name == 'pull_request'
        run: telperion kernel-policy check --base "origin/${{ github.base_ref }}"
      - if: github.event_name != 'pull_request'
        run: telperion kernel-policy check
  lean-checks:
    # The step 4 checks' Lean tests: the negation probe, the statement fingerprint, and the kernel replay both of them
    # run on. Those tests skip unless TELPERION_LEAN_ENV points at a built env, so without this job every must-fail
    # control (the evil-module, shadowed-definition, axiom and vacuous-statement cases) would sit skipped in CI and
    # the job above would still be green. The env is built the way ~/telperion-tools/lean-env is built locally: a
    # bare Lake project that requires Mathlib v4.35.0 on Lean v4.35.0, with Mathlib's oleans from `lake exe cache get`.
    # There is no leanlock on the Linux runner, and none is needed: lean_replay.default_wrapper() uses
    # ~/hodge-engine/leanlock.sh only when that file exists, and runs the pinned lean with no prefix otherwise.
    runs-on: ubuntu-latest
    # The three files took 21.5 minutes on the owner's machine (151 tests); a hosted runner is slower.
    timeout-minutes: 180
    env:
      LEAN_TOOLCHAIN: "leanprover/lean4:v4.35.0"
      MATHLIB_TAG: "v4.35.0"
      # The commit the v4.35.0 tag resolved to when the local env was built (its lake-manifest.json). The job fails if
      # the tag ever resolves to anything else, rather than testing against a Mathlib nobody pinned.
      MATHLIB_REV: "56a005855ea17e0b0958f73ec801ae140b0a1679"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e . pytest

      - name: Place the probe env and its trusted manifest outside the checkout
        # The manifest lives OUTSIDE the env, as it must in production (lean_replay.default_manifest_path): nothing
        # built in the env, or in a submission, should be able to write the file that says what the env should hold.
        run: |
          echo "TELPERION_LEAN_ENV=$RUNNER_TEMP/lean-env" >> "$GITHUB_ENV"
          echo "PROBE_MANIFEST=$RUNNER_TEMP/trusted-manifests/lean-env.json" >> "$GITHUB_ENV"

      - name: Write the probe env (the same lakefile as ~/telperion-tools/lean-env)
        shell: bash
        run: |
          mkdir -p "$TELPERION_LEAN_ENV"
          cd "$TELPERION_LEAN_ENV"
          echo "$LEAN_TOOLCHAIN" > lean-toolchain
          printf '%s\n' 'name = "probeenv"' '[[require]]' 'name = "mathlib"' 'scope = "leanprover-community"' \
            "rev = \"$MATHLIB_TAG\"" > lakefile.toml

      # The cache step and the install step are copied from Arda's telperion-lean-e2e.yml. Arda keys the elan cache on
      # hashFiles(<the island's lean-toolchain>); this env's lean-toolchain is written above from LEAN_TOOLCHAIN and is
      # not in the checkout (hashFiles only sees the workspace), so the key is that pin itself.
      - name: Cache elan toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ env.LEAN_TOOLCHAIN }}

      - name: Install elan
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch Mathlib olean cache
        shell: bash
        run: |
          cd "$TELPERION_LEAN_ENV"
          lake exe cache get

      - name: Check the env is the pinned one, and built
        # tests/lean_env.py's readiness marker is Mathlib.olean; without it `lake env lean` would start a full
        # Mathlib build instead of failing.
        shell: bash
        run: |
          cd "$TELPERION_LEAN_ENV"
          python - <<'PY'
          import json, os, sys
          pkgs = {p["name"]: p for p in json.load(open("lake-manifest.json"))["packages"]}
          rev = pkgs.get("mathlib", {}).get("rev")
          if rev != os.environ["MATHLIB_REV"]:
              sys.exit(f"mathlib resolved to {rev!r}, but the pin is {os.environ['MATHLIB_REV']}")
          PY
          test -f .lake/packages/mathlib/.lake/build/lib/lean/Mathlib.olean
          test "$(cat lean-toolchain)" = "$LEAN_TOOLCHAIN"

      - name: Build the trusted manifest (and check that it verifies and is not overwritten without --force)
        shell: bash
        run: |
          telperion trusted-manifest build --env "$TELPERION_LEAN_ENV" --out "$PROBE_MANIFEST"
          telperion trusted-manifest verify --env "$TELPERION_LEAN_ENV" --out "$PROBE_MANIFEST"
          # A second build without --force must refuse (exit 2) and leave the manifest alone.
          rc=0
          telperion trusted-manifest build --env "$TELPERION_LEAN_ENV" --out "$PROBE_MANIFEST" || rc=$?
          if [ "$rc" != 2 ]; then
            echo "expected trusted-manifest build to refuse an existing manifest with exit 2, got $rc"
            exit 1
          fi

      - name: Lean controls (negation probe, fingerprint, kernel replay)
        # Each test process builds its own copy of the manifest in a temp dir (tests/lean_env.py,
        # session_trusted_manifest), so the tests do not depend on the one built above; that step is the CLI's own
        # check. With the env set, nothing in these three files has a reason to skip, so any skip fails the job:
        # a skipped must-fail control is a control that did not run.
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          python -X faulthandler -m pytest tests/test_negation_probe.py tests/test_fingerprint.py \
            tests/test_lean_replay.py -q -rs 2>&1 | tee "$RUNNER_TEMP/lean-checks.out"
          if grep -Eq '[0-9]+ skipped' "$RUNNER_TEMP/lean-checks.out"; then
            echo "Lean tests were skipped with TELPERION_LEAN_ENV set; every control must run here."
            exit 1
          fi
